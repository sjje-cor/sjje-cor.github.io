<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>《撿手機文學》</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --rose-1: #fdf2f8;
      --rose-2: #fce7f3;
      --rose-3: #f9a8d4;
      --rose-4: #f472b6;
      --rose-5: #db2777;
      --ink: #1f2937;
      --muted: #64748b;
      --bg-soft: #f5f3ff;
      --line-green: #22c55e;
      --insta: #f97316;
      --threads: #111827;
      --panel: rgba(255,255,255,0.88);
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      background: linear-gradient(180deg, #fff1f6, #f5f3ff 38%, #f6f7fb 100%);
      color: var(--ink);
    }

    button, input, textarea {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .phone-frame {
      position: relative;
      width: min(90vw, 390px);
      height: min(92vh, 820px);
      border-radius: 34px;
      overflow: hidden;
      box-shadow: 0 30px 64px rgba(15, 23, 42, 0.28);
      border: 10px solid #0f172a;
      background: #0f172a;
      display: flex;
      flex-direction: column;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    .menu-btn {
      min-width: 42px;
      min-height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,0.06);
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .card {
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(15,23,42,0.08);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.04);
      border-radius: 20px;
      padding: 12px;
    }

    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #ef4444;
      border: 2px solid rgba(255,255,255,0.9);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      padding: 0 4px;
    }

    .lock-wallpaper {
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .lock-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15,23,42,0.15), rgba(15,23,42,0.7));
    }
    .lock-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 90px 28px 26px;
      color: white;
    }

    .pass-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    .pass-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(255,255,255,0.5);
    }
    .pass-dot.filled {
      background: white;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 16px;
      margin-top: 18px;
    }
    .digit-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      margin: 0 auto;
      background: rgba(255,255,255,0.14);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .digit-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.2); }

    .home-screen {
      background-size: cover;
      background-position: center;
      height: 100%;
      position: relative;
      color: white;
    }
    .home-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15,23,42,0.08), rgba(15,23,42,0.48));
    }
    .home-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 72px 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px 10px;
      max-width: 320px;
      margin: 0 auto;
      width: 100%;
    }
    .app-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: white;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
    }
    .app-icon {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 12px 20px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .dock {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px;
      padding: 10px 12px;
      max-width: 320px;
      width: 100%;
      margin: 0 auto;
    }
    .dock-item {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      padding: 10px 0;
      color: white;
      position: relative;
      cursor: pointer;
      min-height: 50px;
    }

    .app-panel {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 22px;
      background: linear-gradient(180deg, #fff, #fff5fb);
    }
    .screen-app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      color: var(--ink);
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 10px;
      background: linear-gradient(180deg, #fff, #f9fafb);
      border-bottom: 1px solid rgba(15,23,42,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .list-group { display: flex; flex-direction: column; gap: 10px; }
    .bubble {
      max-width: 72%;
      padding: 10px 12px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 6px 14px rgba(15,23,42,0.05);
    }
    .bubble.them { background: #e5e7eb; color: var(--ink); border-bottom-left-radius: 6px; }
    .bubble.me { background: linear-gradient(135deg, #4ade80, #10b981); color: white; border-bottom-right-radius: 6px; }
    .chat-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 8px; }
    .chat-row.me { justify-content: flex-end; }
    .reply-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(34,197,94,0.2);
      background: #ecfdf5;
      color: #166534;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .story-strip { display: flex; gap: 12px; overflow-x: auto; padding: 10px 2px 12px; scrollbar-width: none; }
    .story-strip::-webkit-scrollbar { display: none; }
    .story-avatar { width: 58px; height: 58px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #f9a8d4, #a78bfa); }
    .story-avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #fff; padding: 2px; }
    .story-avatar-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .feed-post {
      background: white;
      border: 1px solid rgba(15,23,42,0.06);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(15,23,42,0.04);
    }
    .post-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; }
    .post-user { display: flex; align-items: center; gap: 10px; }
    .avatar-mini { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .post-image { height: 220px; background: linear-gradient(135deg, #fce7f3, #e9d5ff); }
    .post-image img { width: 100%; height: 100%; object-fit: cover; }
    .post-actions { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 0; }
    .post-actions .left { display: flex; gap: 16px; font-size: 13px; color: #374151; }
    .comment-box { padding: 0 14px 14px; }
    .comment { background: #f9fafb; border-radius: 12px; padding: 8px 10px; font-size: 12px; margin-top: 8px; }

    .notification-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: white;
      border: 1px solid rgba(15,23,42,0.06);
      border-radius: 16px;
      padding: 10px;
    }

    .desktop-viewport {
      width: min(1100px, 94vw);
      min-height: min(90vh, 760px);
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .desktop-topbar {
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid rgba(15,23,42,0.08);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .desktop-window-row {
      display: flex;
      flex: 1;
      gap: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #f5f3ff, #fdf2f8);
    }
    .desktop-panel {
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 20px;
      box-shadow: 0 12px 28px rgba(15,23,42,0.07);
      padding: 14px;
      min-width: 260px;
    }
    .desktop-taskbar {
      background: rgba(15,23,42,0.9);
      color: white;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }
    .modal-card {
      background: white;
      width: min(90vw, 420px);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const STORAGE_KEY = 'PICKUP_PHONE_GAME_V3';
    const APP_META = {
      home: { name: '首頁', icon: 'fa-solid fa-house', color: '#f472b6' },
      line: { name: 'LINE', icon: 'fa-brands fa-line', color: '#22c55e' },
      instagram: { name: 'Instagram', icon: 'fa-brands fa-instagram', color: '#f97316' },
      threads: { name: 'Threads', icon: 'fa-solid fa-at', color: '#0f172a' },
      phone: { name: '電話', icon: 'fa-solid fa-phone', color: '#f59e0b' },
      contacts: { name: '聯絡人', icon: 'fa-solid fa-address-book', color: '#60a5fa' },
      photos: { name: '相簿', icon: 'fa-solid fa-images', color: '#a78bfa' },
      settings: { name: '設定', icon: 'fa-solid fa-gear', color: '#64748b' },
      clock: { name: '時鐘', icon: 'fa-solid fa-clock', color: '#14b8a6' },
      calendar: { name: '行事曆', icon: 'fa-regular fa-calendar-days', color: '#fb7185' },
      notes: { name: '備忘錄', icon: 'fa-regular fa-note-sticky', color: '#fbbf24' },
      calculator: { name: '計算機', icon: 'fa-solid fa-calculator', color: '#10b981' },
      search: { name: '搜尋', icon: 'fa-solid fa-magnifying-glass', color: '#8b5cf6' },
      browser: { name: '瀏覽器', icon: 'fa-solid fa-globe', color: '#3b82f6' },
      notifications: { name: '通知中心', icon: 'fa-solid fa-bell', color: '#ef4444' },
    };

    const avatarSVG = {
      unus: createAvatarSvg('UN', '#f9a8d4', '#fff', '#be185d'),
      gao: createAvatarSvg('高', '#fbcfe8', '#fff', '#9d174d'),
      seanko: createAvatarSvg('翔', '#dbeafe', '#fff', '#1d4ed8'),
      yuting: createAvatarSvg('廷', '#ddd6fe', '#fff', '#6d28d9'),
      cy: createAvatarSvg('祐', '#dcfce7', '#fff', '#166534'),
      fan1: createAvatarSvg('A', '#fee2e2', '#fff', '#b91c1c'),
      fan2: createAvatarSvg('B', '#ede9fe', '#fff', '#6d28d9'),
      fan3: createAvatarSvg('C', '#d1fae5', '#fff', '#065f46'),
      fan4: createAvatarSvg('D', '#fef3c7', '#fff', '#92400e'),
      fan5: createAvatarSvg('E', '#dbeafe', '#fff', '#1d4ed8')
    };

    const CHARACTERS = {
      cy: {
        id: 'cy',
        name: '蔡承祐',
        handle: '@4.10_cy',
        code: '0410',
        avatar: avatarSVG.cy,
        wallpaper: 'https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80',
        personality: '熱情、黏人、會撒嬌、會吃醋，私下表達情緒很直接。',
        publicImage: 'UNUS 成員，舞台與舞蹈表現強，常分享生活與練習。',
        privateStyle: '一旦真的在乎就會很細心，愛黏人也會不自覺地想抱著你。',
        relationship: '玩家是秘密戀人，公開上維持平常朋友感，私底下親密。',
        knownInfo: '他知道玩家有秘密交往關係，會偷偷關心你。',
      },
      yt: {
        id: 'yt',
        name: '吳昱廷',
        handle: '@yut1ng_530',
        code: '0530',
        avatar: avatarSVG.yuting,
        wallpaper: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80',
        personality: '感性、浪漫、細心、善於安撫人。',
        publicImage: '音樂與創作型人物，社群上常分享心情與創作。',
        privateStyle: '私下會在夜晚聊深刻的話，會記住你說過的每個小細節。',
        relationship: '玩家是秘密戀人，關係柔軟而真誠。',
        knownInfo: '他知道玩家有時候會想藏起來的一面，用音樂和回憶安撫你。',
      },
      gw: {
        id: 'gw',
        name: '高胥崴',
        handle: '@gao__guei',
        code: '0217',
        avatar: avatarSVG.gao,
        wallpaper: 'https://images.unsplash.com/photo-1461784121038-f088ca1e7714?auto=format&fit=crop&w=900&q=80',
        personality: '成熟可靠、照顧型、話不多但很穩。',
        publicImage: 'UNUS 維持大哥哥形象，處事穩、會照顧團員。',
        privateStyle: '私下會在你累時提醒你吃飯、休息，對你有強烈保護欲。',
        relationship: '玩家是秘密戀人，公開上仍是朋友，私下非常體貼。',
        knownInfo: '他知道你有些在意的東西，但會先在乎你的情緒。',
      },
      yh: {
        id: 'yh',
        name: '高有翔',
        handle: '@seanko61',
        code: '0601',
        avatar: avatarSVG.seanko,
        wallpaper: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80',
        personality: '酷、氣氛感強，觀察細、會默默留意你。',
        publicImage: '專注於照相、穿搭與生活氛圍，拍照風格很有故事感。',
        privateStyle: '會不動聲色地關心你，喜歡在安靜時分享一些不想公開的事情。',
        relationship: '玩家是秘密戀人，私下容易有默契與貼近感。',
        knownInfo: '他知道玩家偏好安靜並不想太多曝光的相處方式。',
      }
    };

    const DEFAULT_STATE = () => ({
      playerName: '',
      selectedCharId: null,
      deviceMode: 'phone',
      unlocked: false,
      currentApp: 'home',
      notifications: [],
      fanAccounts: [],
      lineChats: {},
      instagramPosts: [],
      threadsPosts: [],
      notes: [
        '今晚要問一下約定時間',
        '整理那張相片的備份',
      ],
      calendar: [
        { id: 'evt-1', title: '練團', date: '2026-10-24', time: '18:00', note: '舞台彩排' },
        { id: 'evt-2', title: '晚餐約定', date: '2026-10-25', time: '19:30', note: '待確認' },
      ],
      events: [],
      memories: {
        questionsAsked: [],
        topics: [],
        completedEvents: [],
        pendingEvents: [],
        choices: {}
      },
      unreadNotifications: 0,
      appStates: {}
    });

    function createAvatarSvg(letter, bg1, bg2, accent) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="avatar">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="${bg1}" />
              <stop offset="100%" stop-color="${bg2}" />
            </linearGradient>
          </defs>
          <rect width="120" height="120" rx="60" fill="url(#g)"/>
          <circle cx="60" cy="46" r="21" fill="rgba(255,255,255,0.84)"/>
          <path d="M28 96c8-18 20-28 32-28s24 10 32 28" fill="rgba(255,255,255,0.78)"/>
          <circle cx="60" cy="60" r="48" fill="none" stroke="${accent}" stroke-opacity="0.22" stroke-width="5"/>
          <text x="60" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="${accent}" font-family="Segoe UI, sans-serif">${letter}</text>
        </svg>
      `;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return DEFAULT_STATE();
        const parsed = JSON.parse(raw);
        return { ...DEFAULT_STATE(), ...parsed, memories: { ...DEFAULT_STATE().memories, ...(parsed.memories || {}) } };
      } catch (e) {
        return DEFAULT_STATE();
      }
    }

    let state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(date = new Date()) {
      return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    }

    function parseDateText(date = new Date()) {
      const weeks = ['日','一','二','三','四','五','六'];
      return `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} 週${weeks[date.getDay()]}`;
    }

    function getSelectedCharacter() {
      return state.selectedCharId ? CHARACTERS[state.selectedCharId] : null;
    }

    function getAppColor(appId) {
      return APP_META[appId]?.color || '#f472b6';
    }

    function addNotification({ title, text, app = 'notifications', type = 'info' }) {
      const note = {
        id: `n-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        text,
        app,
        read: false,
        createdAt: new Date().toISOString(),
        type,
      };
      state.notifications = [note, ...state.notifications];
      state.unreadNotifications = state.notifications.filter(n => !n.read).length;
      saveState();
      return note;
    }

    function markRead(id) {
      state.notifications = state.notifications.map(n => n.id === id ? { ...n, read: true } : n);
      state.unreadNotifications = state.notifications.filter(n => !n.read).length;
      saveState();
    }

    function ensureSeedData() {
      const selected = getSelectedCharacter();
      if (!selected) return;

      if (!state.lineChats[selected.id]) {

                  <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9,'C',0,'DEL'].map((key) => `
                      <button class="digit-btn" data-key="${key}">${key === 'DEL' ? '<i class="fa-solid fa-delete-left"></i>' : key}</button>
                    `).join('')}

    function bindLockEvents() {
      let input = '';
      const dotsEl = document.getElementById('lock-dots');
      const errEl = document.getElementById('lock-error');
      const char = getSelectedCharacter();

      const refreshDots = () => {
        if (!dotsEl) return;
        dotsEl.innerHTML = Array.from({ length: 4 }).map((_, i) => `
          <span class="pass-dot ${i < input.length ? 'filled' : ''}"></span>
        `).join('');
      };

      document.querySelectorAll('.digit-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = String(btn.dataset.key);
          if (key === 'C') {
            input = '';
            refreshDots();
            return;
          }
          if (key === 'DEL') {
            input = input.slice(0, -1);
            refreshDots();
            return;
          }
          if (input.length < 4) {
            input += key;
            refreshDots();
            if (input.length === 4) {
              if (input === char.code) {
                state.unlocked = true;
                addNotification({ title: '已解鎖', text: `成功進入 ${char.name} 的手機。`, app: 'home', type: 'success' });
                saveState();
                renderRoot();
              } else {
                if (errEl) {
                  errEl.classList.remove('opacity-0');
                  setTimeout(() => errEl.classList.add('opacity-0'), 1500);
                }
                input = '';
                setTimeout(refreshDots, 300);
              }
            }
          }
        });
      });
      refreshDots();
    }

    function bindAppSpecificEvents() {
      // LINE
      document.getElementById('line-send')?.addEventListener('click', () => {
        const input = document.getElementById('line-input');
        const text = (input?.value || '').trim();
        if (!text) return;
        const char = getSelectedCharacter();
        if (!state.lineChats[char.id]) state.lineChats[char.id] = [];
        state.lineChats[char.id].push({ id: `msg-${Date.now()}`, sender: 'me', text, time: formatTime() });
        saveState();
        renderRoot();

        setTimeout(() => {
          const replies = [
            `收到囉！看到你的訊息心情就變好了。`,
            `真的嗎？那晚點碰面再細說 😉`,
            `好啦，別太累，等會兒記得喝水喔。`,
            `嗯...偷偷告訴你，我也正在想你。`
          ];
          const replyText = replies[Math.floor(Math.random() * replies.length)];
          state.lineChats[char.id].push({ id: `msg-${Date.now()}`, sender: 'them', text: replyText, time: formatTime() });
          addNotification({ title: `${char.name} 傳來新訊息`, text: replyText, app: 'line', type: 'chat' });
          saveState();
          if (state.currentApp === 'line') renderRoot();
        }, 1200);
      });

      document.querySelectorAll('.quick-reply').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById('line-input');
          if (input) input.value = btn.dataset.text;
        });
      });

      // Instagram
      document.querySelectorAll('.ig-like').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const post = state.instagramPosts.find(p => p.id === id);
          if (post) {
            post.liked = !post.liked;
            post.likes += post.liked ? 1 : -1;
            saveState();
            renderRoot();
          }
        });
      });

      document.querySelectorAll('.ig-collect').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const post = state.instagramPosts.find(p => p.id === id);
          if (post) {
            post.collected = !post.collected;
            saveState();
            renderRoot();
          }
        });
      });

      document.querySelectorAll('.ig-comment-submit').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const input = document.querySelector(`.ig-comment-input[data-id="${id}"]`);
          const text = (input?.value || '').trim();
          if (!text) return;
          const post = state.instagramPosts.find(p => p.id === id);
          if (post) {
            if (!post.commentsList) post.commentsList = [];
            post.commentsList.push({ id: `c-${Date.now()}`, user: state.playerName, text, avatar: avatarSVG.unus });
            post.comments += 1;
            saveState();
            renderRoot();
          }
        });
      });

      // Threads
      document.getElementById('th-post-btn')?.addEventListener('click', () => {
        const textarea = document.getElementById('th-content');
        const content = (textarea?.value || '').trim();
        if (!content) return;
        const char = getSelectedCharacter();
        state.threadsPosts = [
          {
            id: `th-${Date.now()}`,
            account: char.handle,
            accountName: char.name,
            avatar: char.avatar,
            content,
            time: '剛剛',
            liked: false,
            boosted: false,
            replies: []
          },
          ...state.threadsPosts
        ];
        saveState();
        renderRoot();
      });

      document.querySelectorAll('.th-like').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const p = state.threadsPosts.find(item => item.id === id);
          if (p) {
            p.liked = !p.liked;
            saveState();
            renderRoot();
          }
        });
      });

      // Notes
      document.getElementById('note-add')?.addEventListener('click', () => {
        const input = document.getElementById('note-input');
        const val = (input?.value || '').trim();
        if (!val) return;
        state.notes.unshift(val);
        saveState();
        renderRoot();
      });

      document.querySelectorAll('.note-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index, 10);
          state.notes.splice(idx, 1);
          saveState();
          renderRoot();
        });
      });

      // Notifications
      document.getElementById('clear-notif')?.addEventListener('click', () => {
        state.notifications = state.notifications.map(n => ({ ...n, read: true }));
        state.unreadNotifications = 0;
        saveState();
        renderRoot();
      });

      // Settings
      document.getElementById('reset-game-action')?.addEventListener('click', resetGame);
      document.querySelectorAll('.mode-switch-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.deviceMode = btn.dataset.mode;
          saveState();
          renderRoot();
        });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderRoot();
    });
  </script>
